[package]
name = "deep-space-indexing-demo"
version = "0.1.0"
edition = "2021"
authors = ["Justin Kilpatrick (justin@althea.net)"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
opt-level = 3
lto = "fat"
panic = 'unwind'

[dependencies]
tokio = {version="1", features=["rt-multi-thread"]}
deep_space = {version="2", features=["ethermint"]}
gravity_proto = "0.4"
cosmos-sdk-proto-althea = "0.16"
futures = "0.3"
sha256 = "1"
prost-types ="0.12"
clap = {version="4", features=["derive"]}
csv = "1.3"
chrono = "0.4"
clarity = "1.4"
log = "0.4"
env_logger = "0.11"
